{% extends 'base.html' %}

{% block content %}
    
<div class="container-fluid">
    <div class="segment-toolbar">
        <div class="segment-heading">
            <h5 class="segment-title">Main Profiles of Applicants</h5>
        </div>
    </div>
    <div class="radar-wrapper">
        <div class="chart-loader" id="radars-loader">
            <div class="spinner"></div>
            <p>Loading ...</p>
        </div>

        <section class="analysis-row-radars">
            <div class="analysis-card">
                <div id="radar1" class="chart-canvas"></div>
            </div>
            <div class="analysis-card">
                <div id="radar2" class="chart-canvas"></div>
            </div>
        </section>

        <section class="analysis-row-radars">
            <div class="analysis-card">
                <div id="radar3" class="chart-canvas"></div>
            </div>
            <div class="analysis-card">
                <div id="radar4" class="chart-canvas"></div>
            </div>
        </section>

        <section class="analysis-row-radars">
            <div class="analysis-card">
                <div id="radar5" class="chart-canvas"></div>
            </div>
        </section>
    </div>
</div>

{% endblock %}
