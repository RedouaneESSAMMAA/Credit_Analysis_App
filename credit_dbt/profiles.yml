credit_dbt:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "md:Credit_Analysis"
      motherduck_token: "{{ env_var('MOTHERDUCK_TOKEN') }}"
      threads: 4
      attach:
        - path: "md:Credit_Analysis"
          alias: Credit_Analysis
    prod:
      type: duckdb
      path: "md:Credit_Analysis"
      motherduck_token: "{{ env_var('MOTHERDUCK_TOKEN') }}"
      threads: 4
      attach:
        - path: "md:Credit_Analysis"
          alias: Credit_Analysis
    
